<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ТВ в Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
        }
        #player-box {
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            background: #000;
        }
        #pip-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
        #pip-btn.show { display: block; }
        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        #list {
            padding: 12px;
        }
        h2 { font-size: 18px; margin-bottom: 10px; opacity: 0.8; }
        .ch {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .ch:active { background: rgba(255,255,255,0.1); }
        .ch.on { background: rgba(0, 150, 255, 0.3); }
        .ch span { font-size: 30px; }
        .info { flex: 1; }
        .name { font-size: 16px; }
        .live { font-size: 12px; opacity: 0.5; }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }
    </style>
</head>
<body>
<div id="player-box">
    <div class="status" id="status">Выберите канал</div>
    <video id="vid" playsinline autoplay muted></video>
    <button id="pip-btn">📺 PiP</button>
</div>
<div id="list">
    <h2>📡 Каналы</h2>
    <div id="channels"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const channels = [
    { name: 'Первый канал', url: 'https://strm.yandex.ru/kal/1tv/1tv0.m3u8' },
    { name: 'Россия 1', url: 'https://strm.yandex.ru/kal/russia1/russia10.m3u8' },
    { name: 'Матч ТВ', url: 'https://strm.yandex.ru/kal/matchtv/matchtv0.m3u8' },
    { name: 'НТВ', url: 'https://strm.yandex.ru/kal/ntv/ntv0.m3u8' },
    { name: 'Пятый канал', url: 'https://strm.yandex.ru/kal/5tv/5tv0.m3u8' },
    { name: 'Россия 24', url: 'https://strm.yandex.ru/kal/russia24/russia240.m3u8' },
    { name: 'Россия К', url: 'https://strm.yandex.ru/kal/kultura/kultura0.m3u8' },
    { name: 'Карусель', url: 'https://strm.yandex.ru/kal/karusel/karusel0.m3u8' },
    { name: 'ОТР', url: 'https://strm.yandex.ru/kal/otr/otr0.m3u8' },
    { name: 'ТВ Центр', url: 'https://strm.yandex.ru/kal/tvc/tvc0.m3u8' },
    { name: 'РЕН ТВ', url: 'https://strm.yandex.ru/kal/rentv/rentv0.m3u8' },
    { name: 'Спас', url: 'https://strm.yandex.ru/kal/spas/spas0.m3u8' },
    { name: 'СТС', url: 'https://strm.yandex.ru/kal/sts/sts0.m3u8' },
    { name: 'Домашний', url: 'https://strm.yandex.ru/kal/domashniy/domashniy0.m3u8' },
    { name: 'ТВ3', url: 'https://strm.yandex.ru/kal/tv3/tv30.m3u8' },
    { name: 'Пятница', url: 'https://strm.yandex.ru/kal/pyatnica/pyatnica0.m3u8' },
    { name: 'Муз-ТВ', url: 'https://strm.yandex.ru/kal/muztv/muztv0.m3u8' },
    { name: 'ТНТ', url: 'https://strm.yandex.ru/kal/tnt/tnt0.m3u8' },
    { name: 'Звезда', url: 'https://strm.yandex.ru/kal/zvezda/zvezda0.m3u8' },
    { name: 'Мир', url: 'https://strm.yandex.ru/kal/mir/mir0.m3u8' }
];

const vid = document.getElementById('vid');
const status = document.getElementById('status');
const pipBtn = document.getElementById('pip-btn');
let hls = null;

if (document.pictureInPictureEnabled) pipBtn.classList.add('show');
pipBtn.onclick = async () => {
    try {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
            pipBtn.textContent = '📺 PiP';
        } else {
            await vid.requestPictureInPicture();
            pipBtn.textContent = '❌ Закрыть';
        }
    } catch(e) {}
};
vid.onleavepictureinpicture = () => pipBtn.textContent = '📺 PiP';

function play(url) {
    if (hls) { hls.destroy(); hls = null; }
    status.textContent = 'Загрузка...';
    status.style.display = 'block';
    vid.style.opacity = '0.5';
    vid.src = '';

    if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(vid);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            status.style.display = 'none';
            vid.style.opacity = '1';
            vid.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, d) => {
            if (d.fatal) {
                status.textContent = '⚠️ Ошибка загрузки';
                vid.style.opacity = '0.3';
            }
        });
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
        vid.src = url;
        vid.onloadeddata = () => { status.style.display = 'none'; vid.style.opacity = '1'; };
        vid.onerror = () => { status.textContent = '⚠️ Ошибка'; vid.style.opacity = '0.3'; };
        vid.play().catch(() => {});
    } else {
        status.textContent = '⚠️ Браузер не поддерживает HLS';
    }
}

const container = document.getElementById('channels');
channels.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'ch';
    div.innerHTML = `<span>📺</span><div class="info"><div class="name">${ch.name}</div><div class="live">Прямой эфир</div></div><div class="dot"></div>`;
    div.onclick = () => {
        play(ch.url);
        document.querySelectorAll('.ch').forEach(el => el.classList.remove('on'));
        div.classList.add('on');
        tg.HapticFeedback.impactOccurred('light');
    };
    container.appendChild(div);
});

// Автозапуск первого
if (channels.length) {
    play(channels[0].url);
    container.firstChild.classList.add('on');
}

tg.BackButton.show();
tg.BackButton.onClick(() => tg.close());
</script>
</body>
</html>
