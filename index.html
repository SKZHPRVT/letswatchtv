<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ТВ в Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: #fff;
        }
        #player-box {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
            max-height: 60vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #external-link {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: #0077FF;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }
        #fallback-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            display: none;
        }
        #channel-list { padding: 12px; }
        h2 { font-size: 18px; margin: 8px 0; opacity: 0.8; }
        .ch {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
        }
        .ch:active { background: rgba(255,255,255,0.15); }
        .ch.on { background: rgba(0, 150, 255, 0.3); }
        .ch span { font-size: 28px; }
        .info { flex: 1; }
        .name { font-size: 16px; font-weight: 500; }
        .src { font-size: 11px; opacity: 0.5; }
    </style>
</head>
<body>
<div id="player-box">
    <iframe id="frame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <div id="fallback-msg">Если плеер не загрузился — нажмите кнопку ниже</div>
    <a id="external-link" href="#" target="_blank">▶ Смотреть на сайте</a>
</div>
<div id="channel-list">
    <h2>📡 Телеканалы</h2>
    <div id="channels"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const channels = [
    { name: 'Первый канал', url: 'https://www.1tv.ru/live' },
    { name: 'Россия 1', url: 'https://smotrim.ru/live/russia1' },
    { name: 'НТВ', url: 'https://www.ntv.ru/air/' },
    { name: 'Матч ТВ', url: 'https://matchtv.ru/live' },
    { name: 'Пятый канал', url: 'https://www.5-tv.ru/live/' },
    { name: 'РЕН ТВ', url: 'https://ren.tv/live' },
    { name: 'Звезда', url: 'https://tvzvezda.ru/schedule/tv-online/' },
    { name: 'Россия 24', url: 'https://smotrim.ru/live/russia24' },
    { name: 'СТС', url: 'https://ctc.ru/online/' },
    { name: 'ТНТ', url: 'https://tnt-online.ru/live' },
    { name: 'Москва 24', url: 'https://www.m24.ru/broadcast/' },
    { name: 'Euronews', url: 'https://ru.euronews.com/live' }
];

const frame = document.getElementById('frame');
const extLink = document.getElementById('external-link');
const fallback = document.getElementById('fallback-msg');

function select(ch) {
    frame.src = ch.url;
    extLink.href = ch.url;
    extLink.style.display = 'block';
    fallback.style.display = 'block';
    
    // Подсветка
    document.querySelectorAll('.ch').forEach(el => el.classList.remove('on'));
    document.querySelector(`[data-ch="${ch.name}"]`).classList.add('on');
    
    tg.HapticFeedback.impactOccurred('light');
}

const container = document.getElementById('channels');
channels.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'ch';
    div.setAttribute('data-ch', ch.name);
    div.innerHTML = `<span>📺</span><div class="info"><div class="name">${ch.name}</div><div class="src">${new URL(ch.url).hostname}</div></div>`;
    div.onclick = () => select(ch);
    container.appendChild(div);
});

// Автозапуск
select(channels[0]);

tg.BackButton.show();
tg.BackButton.onClick(() => tg.close());
</script>
</body>
</html>
